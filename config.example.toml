# Copy to ~/.q38-agent/config.toml (created by `q38 probe` / `q38 web` if missing).
# Primary shell: `q38 web`. `--print` is oneshot; a TTY with no prompt opens the TUI.
# q-harness talks to any OpenAI-compatible endpoint. Primary target: Qwen3.8-27B.
# Existing config.toml is not auto-upgraded — copy these numbers if you still have 16k/8-step defaults.
# Env overlay (Q38_BASE_URL / Q38_API_KEY / Q38_MODEL) applies to CLI/TUI runs only.
# `q38 web` ignores Q38_* on purpose — the console edits this file, and a hidden env
# override would make the settings page lie. Configure via the console or this file.

[server]
base_url = "http://127.0.0.1:8080/v1"
api_key = "local"
model = ""                     # empty => first id from GET /v1/models
profile = "auto"               # auto | llamacpp | vllm | sglang | generic
family = "auto"                # auto | qwen35 | qwen36 | qwen38 | q38next
connect_timeout_s = 5
read_timeout_s = 1800          # long prefills at ~30 tok/s need minutes, not 240s

[context]
working_window = 262144        # native Qwen3.8 coding baseline; do not compact to 16k
hard_cap = 262144
compact_ratio = 0.70           # soft compact at prefix+reserve > window*ratio; hard fail still at window
agents_md_max_tokens = 400     # fail-closed; --agents-md-head clips instead of omitting

[prompt]
coding = false                 # builtin 编程助手 only when AGENT.md is missing
file = "AGENT.md"              # workspace first, then ~/.q38-agent/AGENT.md (~10 字: 工作区助手。路径相对。)
narrate = true                 # TUI/web: one-line 中文 progress narration per stage. --print/IM never narrate.

[policy]
default_mode = "agent"
default_effort = "auto"        # neutral official medium: model chooses depth. /think still provides an override.
max_think_tokens_low = 512
max_think_tokens_medium = 2048
max_think_tokens_xhigh = 4096
max_steps = 80
max_steps_think = 100
max_wall_seconds = 1800
max_steps_unattended = 500      # IM / --channels. 0 = same as max_steps
max_wall_unattended_seconds = 0 # IM: 0 = no wall (Hermes). Interactive still uses max_wall_seconds
max_tokens = 8192
think_mode_max_tokens = 16384
low_precision = false        # on: tighter doom/parse/repeat guards for IQ4/Q3. Model does not see this.

[features]
code_mode = true
tui = false
skills_auto_catalog = false
mcp_auto_catalog = false
workspace_write_only = true
# TUI: ask (prompt writes/bash) | auto (edits pass, bash prompts) | yolo
approvals = "ask"

[sidecar]
transport = "stdio-jsonrpc"
socket_path = ""

[tools]
read_default_lines = 600       # one page ≈ 600 lines; offset/limit pages the rest. 2000 caused 30-60k-char prefill spikes.
result_max_chars = 10000
result_head_chars = 8000
result_tail_chars = 2000
# extra_path = ["~/.cargo/bin"] # optional; bash already prepends rustup/homebrew/local bins when they exist


[code_mode]
timeout_s = 60
inherit_env = true

# [media]
# enabled = true
# max_bytes = 2097152          # inline image freeze cap (2 MB)
# ffmpeg = ""                  # optional; else PATH / Q38_FFMPEG (ffmpeg.exe on Windows)
# whisper = ""                 # whisper-cli; else PATH / Q38_WHISPER
# whisper_model = ""           # ggml .bin; else Q38_WHISPER_MODEL or ~/.q38-agent/whisper/ggml-tiny.bin
#                              # Windows: %USERPROFILE%\.q38-agent\whisper\ggml-tiny.bin

# One web(query|url) tool, appended at session start (same freeze discipline as mcp).
# Zero-config: keyless engines (Bing HTML, DuckDuckGo lite) + readability fetch.
# A Tavily key upgrades the backend to Tavily REST transparently, builtin as
# fallback. Key lookup: tavily_api_key here → env TAVILY_API_KEY → any mounted
# MCP server env with TAVILY_API_KEY (existing tavily-mcp users switch for free,
# minus the npx cold start). Output format is identical either way.
[web]
enabled = true
provider = "auto"              # auto | builtin | tavily
tavily_api_key = ""
engines = ["bing", "duckduckgo"]
timeout_s = 12
max_results = 5
fetch_max_bytes = 2000000

# Console Files page. `q38 web` (without --workspace) reopens this folder.
# Empty / omitted = process cwd. Changing the folder in the UI writes this back.
# [console]
# workspace = ""

# One mcp() tool is appended only when servers are listed (session-start freeze).
# Catalog stays out of system unless mcp_auto_catalog. Bodies/methods are a hidden
# card on "mcp" / [mcp:name] / /name — same geometry as skills.
# Overlay: config.toml [mcp], ~/.q38-agent/mcp.toml + mcp/*.toml, then
# workspace .q38/mcp.toml + .q38/mcp/*.toml (later wins). Never expand tools/list
# into OpenAI tools[]. Env/command stay out of the card.
# [mcp]
# timeout_s = 30
# [[mcp.servers]]
# name = "example"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-everything"]
# description = "example server"
# methods = ["echo"]
# cwd = ""
