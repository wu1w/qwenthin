[workspace]
resolver = "2"
members = [
    "crates/q38-loop",
    "crates/q38-cli",
    "crates/q38-tui",
    "crates/q38-web",
    "crates/q38-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "q-harness: reasoning-economy coding agent for the Qwen3.5 family (primary: Qwen3.8-27B)"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
minijinja = { version = "2.12", default-features = false, features = [
    "builtins",
    "debug",
    "deserialization",
    "macros",
    "adjacent_loop_items",
    "std_collections",
    "serde",
    "json",
    "preserve_order",
] }
minijinja-contrib = { version = "2.12", features = ["pycompat"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
    "multipart",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
    "process",
    "io-util",
    "net",
    "signal",
] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
aes-gcm = "0.10"
tower-http = { version = "0.6", features = ["fs", "cors"] }
encoding_rs = "0.8"
